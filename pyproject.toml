[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email-workflow-lab"
version = "0.1.0"
description = "Autonomous Email Workflow CLI test harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "pytest>=7.0.0"
]

[project.scripts]
email-workflow = "email_workflow.cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
