ai:
  api:
    api_key_env: GEMINI_API_KEY
    max_output_tokens: 4000
    model: gemini-3.1-flash-lite
    provider: gemini
    requests_per_minute: 15
    temperature: 0.1
  fallback:
    auto_detect: true
    auto_order:
    - gemini
    - groq
    - openai
    - openrouter
    chain:
    - api_key_env: null
      model: gemini-3-flash-preview
      provider: gemini
    enabled: true
    use_local_last: true
  keys:
    auto_detect: true
    extra: {}
    max_workers: 0
    parallel: true
    review: true
  local:
    endpoint: http://localhost:11434
    model: llama3.2
    runtime: ollama
    temperature: 0.1
  mode: api
  usage:
    limits: {}
    store: usage.jsonl
    warn_at_percent: 80
automation:
  autonomous_rules: []
  confidence_threshold_auto_reply: 0.9
  confidence_threshold_draft: 0.6
  learn_facts_from_email: true
  level: autonomous
  never_archive_about:
  - job offers, recruitment, and anything about my job applications
  trusted_categories:
  - newsletter
  - receipt
  - notification
  - work
email:
  account_ref: wiktorskrabel89@gmail.com
  allow_send: true
  archive_unimportant: true
  create_drafts: true
  important_label: Priorytet
  labels:
  - about: discount codes, sales and promotional offers from shops - for example -10%
      from Modivo, -30% from Reserved, Travelist deals
    keep_in_inbox: false
    name: Rabaty
  - about: anything to do with work and hiring - job adverts and offers, recruitment
      mail, job alerts, 'last chance to send a CV', and employers replying about an
      application I sent. Pracuj.pl, Praca.pl, OLX praca, LinkedIn jobs
    keep_in_inbox: true
    name: Praca
  - about: orders, deliveries, parcels and receipts - InPost, Allegro, Amazon, a shop
      confirming an order or a courier tracking a parcel
    keep_in_inbox: false
    name: Zakupy
  - about: money - bank messages, invoices, payments, subscription charges, insurance
      and anything asking me to pay or confirming I paid
    keep_in_inbox: true
    name: Finanse
  - about: account and security mail - login alerts, password resets, verification
      codes, two-factor prompts, suspicious sign-in warnings
    keep_in_inbox: true
    name: Bezpieczenstwo
  - about: newsletters and social notices I subscribed to - Legimi, Wisla Krakow,
      shopping and sports newsletters, LinkedIn and OLX activity. NOT job adverts
      or recruitment mail, which are Praca even when they arrive as a newsletter
    keep_in_inbox: false
    name: Newslettery
  mailbox: INBOX
  max_age_days: 7
  max_emails_per_run: 0
  poll_interval_seconds: 60
  provider: gmail
  star_important: false
  sync_mode: poll
notifications:
  channel: discord
  digest_mode: immediate
  show_message_breakdown: false
security:
  max_login_attempts: 3
  require_login: true
  show_password_while_typing: true
  store: auth.json
state:
  store: state.json
update:
  check_automatically: true
  source: ''
